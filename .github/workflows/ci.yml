name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint, test, build, browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install (lockfile must be up to date)
        run: pnpm install --frozen-lockfile

      # Builds packages, typechecks every project, lints, checks formatting, runs unit tests,
      # verifies the consumer resolves packages from dist/, and builds both apps.
      - name: Quality checks
        run: pnpm check

      - name: Component reference is up to date
        run: |
          pnpm docs:components
          git diff --exit-code docs/components.md

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Browser tests (production builds)
        run: pnpm test:e2e
        env:
          CI: true

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
